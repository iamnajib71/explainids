[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "explainids"
version = "0.2.0"
description = "Explainable ML network intrusion detection with MITRE ATT&CK context"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "xgboost>=2.1", "lightgbm>=4.5",
  "shap>=0.46", "joblib>=1.4", "pyarrow>=17",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "python-multipart>=0.0.9"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
